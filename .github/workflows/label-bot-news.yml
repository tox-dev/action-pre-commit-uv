name: Label bot news
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Only a pinned action reads PR metadata; no PR code is checked out or run.
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@296388849cced16665b3e8b4397a22265418d3dc
