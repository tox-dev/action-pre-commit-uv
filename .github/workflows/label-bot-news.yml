name: Label bot news
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] No PR code is checked out or run.
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@a040f8eb1c335676f3f97db2010a1a39a3cea1ac
