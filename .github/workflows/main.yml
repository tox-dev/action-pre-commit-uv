name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, test-me-*]
permissions:
  contents: read
jobs:
  self-test-uvx:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: self test action (uvx path)
        uses: $/
  self-test-uv-run:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.13"
          enable-cache: false
      - run: printf '[project]\nname = "test"\nversion = "0.0.0"\nrequires-python = ">=3.13,<3.14"\n' >pyproject.toml
        shell: bash
      - name: self test action (uv run path)
        uses: $/
  self-test-external-uv:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: self test action (external uv)
        uses: $/
        with:
          uv-install: 'false'
  news:
    name: News fragment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync \
            --preview-features pylock \
            --python "$RUNNER_TEMP/release-tools/bin/python" \
            --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - uses: tox-dev/github-workflows/validate-news@a32ce094895292b19eea422fc6500f1ef1ae8d5f
  hook-update-cooldown:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/check-hook-update-cooldown@a32ce094895292b19eea422fc6500f1ef1ae8d5f
        with:
          repository: ${{ github.repository }}
          pull-request: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
  gate:
    name: Required checks pass
    if: always()
    needs: [self-test-uvx, self-test-uv-run, self-test-external-uv, news, hook-update-cooldown]
    runs-on: ubuntu-26.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT_NAME" '
            all(
              to_entries[];
              .value.result == "success" or
              ((.key == "news" or .key == "hook-update-cooldown") and
               .value.result == "skipped" and $event != "pull_request")
            )
          ' <<<"$NEEDS_JSON"
