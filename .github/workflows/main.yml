name: 🧪 CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, test-me-*]
permissions:
  contents: read
jobs:
  self-test-uvx:
    name: 🧪 Self-test with uvx
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🧪 Self test action (uvx path)
        uses: $/
  self-test-uv-run:
    name: 🧪 Self-test with uv run
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.13"
          enable-cache: false
      - name: ⚙️ Write a test pyproject.toml
        run: printf '[project]\nname = "test"\nversion = "0.0.0"\nrequires-python = ">=3.13,<3.14"\n' >pyproject.toml
        shell: bash
      - name: 🧪 Self test action (uv run path)
        uses: $/
  self-test-external-uv:
    name: 🧪 Self-test with external uv
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 🧪 Self test action (external uv)
        uses: $/
        with:
          uv-install: 'false'
  gate:
    name: 🚦 ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Non-PR checks pass' }}
    if: always()
    needs: [self-test-uvx, self-test-uv-run, self-test-external-uv]
    runs-on: ubuntu-26.04
    steps:
      - name: 🚦 Require all needed jobs to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(to_entries[]; .value.result == "success")' <<<"$NEEDS_JSON"
