name: 🧪 CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, test-me-*]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  self-test-uvx:
    name: 🧪 Self-test with uvx
    runs-on: ubuntu-26.04
    steps:
      # The repository root has a pyproject.toml, which would send the Action down its uv run path.
      - name: ⚙️ Create a git repository without a Python project
        run: |
          git init --quiet
          cat >.pre-commit-config.yaml <<'EOF'
          repos:
            - repo: https://github.com/pre-commit/pre-commit-hooks
              rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
              hooks:
                - id: check-yaml
                - id: end-of-file-fixer
          EOF
          git add .pre-commit-config.yaml
        shell: bash
      - name: 🧪 Self test action (uvx path)
        uses: $/
        with:
          uv-install: 'true'
  self-test-uv-run:
    name: 🧪 Self-test with uv run
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: "3.13"
          enable-cache: false
      - name: ⚙️ Write a test pyproject.toml
        run: printf '[project]\nname = "test"\nversion = "0.0.0"\nrequires-python = ">=3.13,<3.14"\n' >pyproject.toml
        shell: bash
      - name: 🧪 Self test action (uv run path)
        uses: $/
  self-test-external-uv:
    name: 🧪 Self-test with external uv
    runs-on: ubuntu-26.04
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 🧪 Self test action (external uv)
        uses: $/
        with:
          uv-install: 'false'
  release:
    name: 🏷️ Release dry run
    uses: $/.github/workflows/prepare-release.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      dry-run: true
  hooks:
    name: 🧹 Hooks under the cooldown
    uses: tox-dev/github-workflows/.github/workflows/cooled-hooks.yaml@0c4cffd63033d38196319524d101caae1eef925b # 6.7.2
    permissions:
      contents: read
  gate:
    name: 🚦 ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Non-PR checks pass' }}
    if: always()
    needs: [self-test-uvx, self-test-uv-run, self-test-external-uv, release, hooks]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
        with:
          needs: ${{ toJSON(needs) }}
