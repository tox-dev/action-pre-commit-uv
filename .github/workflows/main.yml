name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, test-me-*]

permissions:
  contents: read

jobs:
  self-test-uvx:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: self test action (uvx path)
      uses: $/
  self-test-uv-run:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: printf '[project]\nname = "test"\nversion = "0.0.0"\nrequires-python = ">=3.13"\n' > pyproject.toml
      shell: bash
    - name: self test action (uv run path)
      uses: $/
  self-test-external-uv:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.15"
        enable-cache: false
    - name: self test action (external uv)
      uses: $/
      with:
        uv-install: 'false'
  news:
    name: News fragment
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip news')
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Require a user-facing change
      run: |
        found=0
        while IFS= read -r path; do
          if [[ "$path" =~ ^changelog\.d/[0-9]+\.(feature|bugfix|doc)\.md$ && -s "$path" ]]; then
            found=1
          fi
        done < <(git diff --name-only --diff-filter=AM "origin/$GITHUB_BASE_REF"...HEAD)
        if (( found == 0 )); then
          echo "::error::add a nonempty changelog.d/<PR>.<type>.md fragment or apply skip news"
          exit 1
        fi
  gate:
    name: Required checks pass
    if: always()
    needs: [self-test-uvx, self-test-uv-run, self-test-external-uv, news]
    runs-on: ubuntu-26.04
    steps:
    - env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        jq -e 'all(to_entries[]; .value.result == "success" or (.key == "news" and .value.result == "skipped"))' <<< "$NEEDS_JSON"
