name: Update floating tags

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Full version tag to point the floating tags at (e.g. v1.0.4)
        required: true

permissions:
  contents: read

jobs:
  update-floating-tags:
    runs-on: ubuntu-26.04
    if: github.event_name != 'release' || !github.event.release.prerelease
    environment: release-auth
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        persist-credentials: false
    - name: Require release notes in the changelog
      env:
        TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      run: |
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::unexpected release tag $TAG"
          exit 1
        fi
        awk -v heading="## $TAG " '
          /^## / { if (found) exit; found = index($0, heading) == 1; next }
          found { print }
        ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
        if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
          echo "::error::CHANGELOG.md has no section for $TAG"
          exit 1
        fi
    - name: Publish GitHub release
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
    - id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
    - name: Move major and minor tags to the released version
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      run: |
        set -euo pipefail
        if [[ ! "${TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
          echo "::error::Unexpected tag format: ${TAG} (expected vMAJOR.MINOR.PATCH)" >&2
          exit 1
        fi
        major="v${BASH_REMATCH[1]}"
        minor="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
        sha="$(gh api "repos/${REPO}/commits/${TAG}" --jq '.sha')"
        for ref in "${major}" "${minor}"; do
          if gh api "repos/${REPO}/git/ref/tags/${ref}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/tags/${ref}" -f "sha=${sha}" -F force=true >/dev/null
          else
            gh api -X POST "repos/${REPO}/git/refs" -f "ref=refs/tags/${ref}" -f "sha=${sha}" >/dev/null
          fi
          echo "Pointed ${ref} -> ${TAG} (${sha})"
        done
