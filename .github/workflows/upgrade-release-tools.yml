name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: 0 8 * * 2
permissions: {}
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@0058b07258b89dbb66be0d9be229adbb336b5768
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      python-version: "3.15"
      check-workflow: main.yml
