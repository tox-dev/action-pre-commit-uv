name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: 0 8 * * 2
permissions: {}
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@9a4e76e2f4901856f2784f6c0efc89278c518b1f
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      python-version: "3.15"
      check-workflow: main.yml
