name: Upgrade release tools
on:
  workflow_dispatch:
  schedule:
    - cron: 0 8 * * 2
permissions: {}
jobs:
  upgrade:
    uses: tox-dev/github-workflows/.github/workflows/upgrade-release-tools.yaml@296388849cced16665b3e8b4397a22265418d3dc
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      python-version: "3.15"
      check-workflow: main.yml
