name: 🛡️ CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 2"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  analyze:
    name: 🛡️ Analyze
    uses: tox-dev/github-workflows/.github/workflows/codeql.yaml@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
    permissions:
      contents: read
      security-events: write
    with:
      languages: '["actions"]'
